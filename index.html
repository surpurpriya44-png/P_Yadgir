
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yadgir District | GIS Dashboard</title>

    <!-- EXISTING QGIS2WEB CSS -->
    <link rel="stylesheet" href="./resources/ol.css">
    <link rel="stylesheet" href="resources/fontawesome-all.min.css">
    <link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
    <link rel="stylesheet" href="./resources/ol-layerswitcher.css">
    <link rel="stylesheet" href="./resources/qgis2web.css">

    <style>

        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
        }

        /* MAIN DASHBOARD */

        #dashboard {
            display: flex;
            width: 100%;
            height: 100vh;
        }

        /* LEFT PANEL */

        #sidebar {
            width: 290px;
            min-width: 290px;
            height: 100%;
            background: #142D46;
            color: white;
            overflow-y: auto;
            z-index: 1000;
            box-shadow: 3px 0 12px rgba(0,0,0,0.25);
        }

        .dashboard-header {
            padding: 27px 20px 23px;
            background: #0C2034;
            border-bottom: 4px solid #25A8D5;
        }

        .dashboard-header .subtitle {
            font-size: 10px;
            color: #5BC0E8;
            letter-spacing: 2px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        .dashboard-header h1 {
            font-size: 23px;
            line-height: 1.3;
            margin: 0;
            color: #FFFFFF;
        }

        .dashboard-header h2 {
            font-size: 15px;
            font-weight: normal;
            color: #C5D7E5;
            margin: 5px 0 0;
        }

        .dashboard-header .description {
            margin-top: 17px;
            font-size: 11px;
            color: #A9C3D5;
            line-height: 1.6;
        }

        /* SIDEBAR SECTIONS */

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.12);
        }

        .section-heading {
            font-size: 12px;
            font-weight: bold;
            color: #65C9EC;
            letter-spacing: 1.2px;
            margin-bottom: 17px;
            text-transform: uppercase;
        }

        /* LAYER CHECKBOXES */

        #layer-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .layer-row {
            display: flex;
            align-items: center;
            gap: 11px;
            font-size: 13px;
            color: #E8F0F5;
            cursor: pointer;
        }

        .layer-row input {
            width: 16px;
            height: 16px;
            accent-color: #28B5E5;
            cursor: pointer;
        }

        .legend-symbol {
            width: 13px;
            height: 13px;
            display: inline-block;
            border-radius: 2px;
            flex-shrink: 0;
        }

        .legend-boundary {
            background: transparent;
            border: 2px solid #202020;
        }

        .legend-water {
            background: #2589D1;
        }

        .legend-stream {
            background: #63B8E8;
            height: 3px;
        }

        .legend-roads {
            background: #F0789D;
            height: 3px;
        }

        .legend-railway {
            background: #A78BFA;
            height: 3px;
        }

        .legend-landuse {
            background: #E6C74B;
        }

        .legend-buildings {
            background: #9C8A79;
        }

        /* BASEMAP BUTTONS */

        .basemap-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .basemap-btn {
            width: 100%;
            padding: 12px 13px;
            background: #203F5B;
            border: 1px solid #47647C;
            border-radius: 5px;
            color: #E7F0F6;
            text-align: left;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }

        .basemap-btn:hover {
            background: #285A7C;
        }

        .basemap-btn.active {
            background: #087EAF;
            border-color: #55C8F0;
            color: white;
        }

        .basemap-btn span {
            margin-right: 9px;
        }

        /* SELECT ALL */

        .layer-actions {
            display: flex;
            gap: 8px;
            margin-top: 18px;
        }

        .layer-actions button {
            flex: 1;
            padding: 7px;
            font-size: 11px;
            border: 1px solid #57738B;
            background: #203F5B;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .layer-actions button:hover {
            background: #087EAF;
        }

        /* SIDEBAR FOOTER */

        .sidebar-footer {
            padding: 18px 20px;
            color: #9CB7CA;
            font-size: 11px;
            line-height: 1.8;
        }

        /* MAP AREA */

        #map-container {
            flex: 1;
            min-width: 0;
            height: 100%;
            position: relative;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #E7E9E6;
        }

        /* NORTH ARROW */

        #north-arrow {
            position: absolute;
            top: 20px;
            right: 23px;
            z-index: 500;

            background: rgba(255,255,255,0.96);
            width: 58px;
            height: 75px;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            border-radius: 7px;
            box-shadow: 0 2px 9px rgba(0,0,0,0.25);
        }

        #north-arrow .north-label {
            font-size: 14px;
            font-weight: bold;
            color: #142D46;
        }

        #north-arrow .north-symbol {
            font-size: 37px;
            line-height: 38px;
            color: #142D46;
        }

        /* SCALE BAR */

        .ol-scale-line {
            left: 20px !important;
            right: auto !important;
            bottom: 20px !important;
            background: rgba(15,43,65,0.85) !important;
            padding: 8px 10px !important;
            border-radius: 5px !important;
        }

        .ol-scale-line-inner {
            color: white !important;
            border-color: white !important;
            font-size: 11px !important;
        }

        /* OPENLAYERS CONTROLS */

        .ol-control {
            background: rgba(255,255,255,0.3) !important;
            padding: 3px !important;
        }

        .ol-control > button {
            background: #FFFFFF !important;
            color: #243B50 !important;
            border-radius: 4px !important;
        }

        .ol-control > button:hover {
            background: #DCECF4 !important;
        }

        .ol-attribution {
            font-size: 10px !important;
        }

        /* POPUP */

        .ol-popup {
            background: white;
            border-radius: 7px;
        }

        /* MOBILE VIEW */

        @media(max-width: 700px) {

            #sidebar {
                width: 225px;
                min-width: 225px;
            }

            .dashboard-header h1 {
                font-size: 19px;
            }

            .panel-section {
                padding: 15px;
            }

        }

    </style>

</head>

<body>

<div id="dashboard">

    <!-- LEFT SIDEBAR -->

    <aside id="sidebar">

        <div class="dashboard-header">

            <div class="subtitle">
                GIS & REMOTE SENSING
            </div>

            <h1>Yadgir District</h1>

            <h2>Karnataka, India</h2>

            <div class="description">
                Geographic Information System<br>
                Spatial Data Visualization Dashboard
            </div>

        </div>


        <!-- MAP LEGEND -->

        <div class="panel-section">

            <div class="section-heading">
                <i class="fas fa-layer-group"></i>
                &nbsp; Map Legend
            </div>

            <div id="layer-list">

                <!-- Generated dynamically from qgis2web layers -->

            </div>

            <div class="layer-actions">

                <button id="show-all">Select All</button>

                <button id="hide-all">Clear All</button>

            </div>

        </div>


        <!-- BASEMAPS -->

        <div class="panel-section">

            <div class="section-heading">
                <i class="fas fa-map"></i>
                &nbsp; Base Maps
            </div>

            <div class="basemap-buttons">

                <button class="basemap-btn active" id="satellite-btn">
                    <span>🌍</span> Satellite Imagery
                </button>

                <button class="basemap-btn" id="osm-btn">
                    <span>🗺️</span> OpenStreetMap
                </button>

                <button class="basemap-btn" id="light-btn">
                    <span>⬜</span> Light Map
                </button>

            </div>

        </div>


        <!-- FOOTER -->

        <div class="sidebar-footer">

            <hr style="border-color:#47647C;">

            <b>YADGIR DISTRICT</b><br>

            Karnataka, India<br>

            GIS-Based Spatial Information

        </div>

    </aside>


    <!-- MAP -->

    <main id="map-container">

        <div id="map">

            <div id="popup" class="ol-popup">

                <a href="#" id="popup-closer"
                   class="ol-popup-closer"></a>

                <div id="popup-content"></div>

            </div>

        </div>


        <!-- NORTH ARROW -->

        <div id="north-arrow">

            <div class="north-label">N</div>

            <div class="north-symbol">↑</div>

        </div>

    </main>

</div>


<!-- EXISTING QGIS2WEB SCRIPTS -->

<script src="resources/qgis2web_expressions.js"></script>

<script src="./resources/functions.js"></script>

<script src="./resources/ol.js"></script>

<script src="./resources/ol-layerswitcher.js"></script>

<script src="resources/photon-geocoder-autocomplete.min.js"></script>

<script src="resources/olms.js"></script>


<!-- YOUR ORIGINAL LAYERS -->

<script src="layers/buildings_2.js"></script>

<script src="layers/Landuse_3.js"></script>

<script src="layers/Railway_4.js"></script>

<script src="layers/Roads_5.js"></script>

<script src="layers/Stream_ydg_6.js"></script>

<script src="layers/Waterbodies_1_7.js"></script>

<script src="layers/Yadgir_Boundary_8.js"></script>


<!-- ORIGINAL STYLES -->

<script src="styles/buildings_2_style.js"></script>

<script src="styles/Landuse_3_style.js"></script>

<script src="styles/Railway_4_style.js"></script>

<script src="styles/Roads_5_style.js"></script>

<script src="styles/Stream_ydg_6_style.js"></script>

<script src="styles/Waterbodies_1_7_style.js"></script>

<script src="styles/Yadgir_Boundary_8_style.js"></script>


<script src="./layers/layers.js"></script>

<script src="./resources/Autolinker.min.js"></script>

<script src="./resources/qgis2web.js"></script>


<!-- DASHBOARD FUNCTIONALITY -->

<script>

(function () {

    function initializeDashboard() {

        // Wait for qgis2web map initialization

        if (typeof map === "undefined" ||
            typeof ol === "undefined") {

            setTimeout(initializeDashboard, 300);
            return;
        }

        if (map.get("dashboardInitialized")) return;

        map.set("dashboardInitialized", true);


        /* ==================================
           1. GET ORIGINAL QGIS2WEB LAYERS
        ================================== */

        var originalLayers =
            (typeof layersList !== "undefined")
            ? layersList
            : [];

        var allLayers = originalLayers.filter(function(layer) {
            return layer instanceof ol.layer.Base;
        });


        /* ==================================
           2. FIND LAYERS BY THEIR NAMES
        ================================== */

        function getLayerName(layer) {

            var values = [
                layer.get("title"),
                layer.get("name"),
                layer.get("popuplayertitle"),
                layer.get("displayName")
            ];

            return values.filter(Boolean).join(" ").toLowerCase();
        }


        var layerDefinitions = [

            {
                label: "District Boundary",
                pattern: /yadgir.*boundary|boundary/,
                symbol: "legend-boundary",
                fallbackIndex: 6
            },

            {
                label: "Waterbodies",
                pattern: /waterbod/,
                symbol: "legend-water",
                fallbackIndex: 5
            },

            {
                label: "Streams",
                pattern: /stream/,
                symbol: "legend-stream",
                fallbackIndex: 4
            },

            {
                label: "Roads",
                pattern: /roads?/,
                symbol: "legend-roads",
                fallbackIndex: 3
            },

            {
                label: "Railway",
                pattern: /railway/,
                symbol: "legend-railway",
                fallbackIndex: 2
            },

            {
                label: "Land Use",
                pattern: /landuse|land.use/,
                symbol: "legend-landuse",
                fallbackIndex: 1
            },

            {
                label: "Buildings",
                pattern: /buildings?/,
                symbol: "legend-buildings",
                fallbackIndex: 0
            }

        ];


        var matchedLayers = [];
        var usedLayers = [];


        layerDefinitions.forEach(function(definition) {

            var layer = allLayers.find(function(item) {

                return !usedLayers.includes(item) &&
                    definition.pattern.test(getLayerName(item));

            });


            // Fallback to the original exported layer order

            if (!layer) {

                layer = allLayers[definition.fallbackIndex];

                if (usedLayers.includes(layer)) {
                    layer = null;
                }

            }


            if (layer) {

                usedLayers.push(layer);

                matchedLayers.push({
                    label: definition.label,
                    symbol: definition.symbol,
                    layer: layer
                });

            }

        });


        /* ==================================
           3. CREATE SIDEBAR LAYER CONTROLS
        ================================== */

        var layerList = document.getElementById("layer-list");


        matchedLayers.forEach(function(item, index) {

            var label = document.createElement("label");

            label.className = "layer-row";


            var checkbox = document.createElement("input");

            checkbox.type = "checkbox";

            checkbox.checked = item.layer.getVisible();


            checkbox.addEventListener("change", function() {

                item.layer.setVisible(checkbox.checked);

            });


            var symbol = document.createElement("span");

            symbol.className =
                "legend-symbol " + item.symbol;


            var name = document.createElement("span");

            name.textContent = item.label;


            label.appendChild(checkbox);

            label.appendChild(symbol);

            label.appendChild(name);


            layerList.appendChild(label);

        });


        /* ==================================
           4. SELECT ALL / CLEAR ALL
        ================================== */

        document.getElementById("show-all")
        .addEventListener("click", function() {

            matchedLayers.forEach(function(item) {

                item.layer.setVisible(true);

                item.checkbox = true;

            });

            layerList.querySelectorAll("input")
            .forEach(function(input) {

                input.checked = true;

            });

        });


        document.getElementById("hide-all")
        .addEventListener("click", function() {

            matchedLayers.forEach(function(item) {

                item.layer.setVisible(false);

            });

            layerList.querySelectorAll("input")
            .forEach(function(input) {

                input.checked = false;

            });

        });


        /* ==================================
           5. CREATE BASEMAPS
        ================================== */

        var satellite = new ol.layer.Tile({

            source: new ol.source.XYZ({

                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",

                attributions:
                'Tiles © Esri'

            }),

            visible: true

        });


        var osm = new ol.layer.Tile({

            source: new ol.source.OSM(),

            visible: false

        });


        var light = new ol.layer.Tile({

            source: new ol.source.XYZ({

                url: "https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",

                attributions:
                '© OpenStreetMap contributors © CARTO'

            }),

            visible: false

        });


        /*
          Insert basemaps at the bottom of the map layer stack.
          Original vector layers remain above the basemaps.
        */

        map.getLayers().insertAt(0, satellite);

        map.getLayers().insertAt(0, osm);

        map.getLayers().insertAt(0, light);


        /* ==================================
           6. BASEMAP BUTTON FUNCTION
        ================================== */

        var basemapOptions = [

            {
                id: "satellite-btn",
                layer: satellite
            },

            {
                id: "osm-btn",
                layer: osm
            },

            {
                id: "light-btn",
                layer: light
            }

        ];


        basemapOptions.forEach(function(option) {

            document.getElementById(option.id)
            .addEventListener("click", function() {


                basemapOptions.forEach(function(base) {

                    base.layer.setVisible(false);

                    document.getElementById(base.id)
                    .classList.remove("active");

                });


                option.layer.setVisible(true);

                document.getElementById(option.id)
                .classList.add("active");


            });

        });


        /* ==================================
           7. ADD SCALE BAR
        ================================== */

        map.addControl(

            new ol.control.ScaleLine({

                units: "metric",

                bar: false,

                text: true,

                minWidth: 100

            })

        );


        /* ==================================
           8. UPDATE MAP SIZE
        ================================== */

        map.updateSize();


        window.addEventListener("resize", function() {

            map.updateSize();

        });


        console.log("Yadgir GIS Dashboard Initialized");

        console.log("Original layers detected:", allLayers.length);

        console.log("Layers connected:", matchedLayers.length);

    }


    // Start dashboard after page loading

    if (document.readyState === "loading") {

        document.addEventListener(
            "DOMContentLoaded",
            initializeDashboard
        );

    } else {

        initializeDashboard();

    }

})();

</script>

</body>
</html>

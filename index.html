<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Yadgir District GIS Dashboard</title>

<link rel="stylesheet" href="./resources/ol.css">
<link rel="stylesheet" href="resources/fontawesome-all.min.css">
<link rel="stylesheet" href="resources/photon-geocoder-autocomplete.min.css">
<link rel="stylesheet" href="./resources/ol-layerswitcher.css">
<link rel="stylesheet" href="./resources/qgis2web.css">

<style>

/* GENERAL */

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    position: fixed;
}

#dashboard {
    display: flex;
    width: 100%;
    height: 100%;
    position: relative;
}

/* MOBILE TOGGLE BUTTON */

#mobile-menu-btn {
    display: none;
    position: absolute;
    top: 15px;
    left: 15px;
    z-index: 1100;
    background: #142D46;
    color: white;
    border: 2px solid #25A8D5;
    padding: 8px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 3px 8px rgba(0,0,0,0.3);
}

/* SIDEBAR */

#sidebar {
    width: 290px;
    min-width: 290px;
    height: 100%;
    background: #142D46;
    color: white;
    overflow-y: auto;
    z-index: 1200;
    box-shadow: 3px 0 12px rgba(0,0,0,0.25);
    transition: transform 0.3s ease-in-out;
}

/* SIDEBAR CLOSE BUTTON (MOBILE ONLY) */

#sidebar-close-btn {
    display: none;
    background: none;
    border: none;
    color: #A9C3D5;
    font-size: 20px;
    float: right;
    cursor: pointer;
    line-height: 1;
}

/* HEADER */

.dashboard-header {
    padding: 27px 20px 23px;
    background: #0C2034;
    border-bottom: 4px solid #25A8D5;
}

.dashboard-header .subtitle {
    font-size: 10px;
    color: #5BC0E8;
    letter-spacing: 2px;
    font-weight: bold;
    margin-bottom: 12px;
}

.dashboard-header h1 {
    font-size: 22px;
    line-height: 1.3;
    margin: 0;
    color: white;
}

.dashboard-header h2 {
    font-size: 14px;
    font-weight: normal;
    color: #C5D7E5;
    margin: 5px 0 0;
}

.dashboard-header .description {
    margin-top: 15px;
    font-size: 11px;
    color: #A9C3D5;
    line-height: 1.6;
}

/* SIDEBAR SECTIONS */

.panel-section {
    padding: 18px 20px;
    border-bottom: 1px solid rgba(255,255,255,0.12);
}

.section-heading {
    font-size: 12px;
    font-weight: bold;
    color: #65C9EC;
    letter-spacing: 1.2px;
    margin-bottom: 15px;
    text-transform: uppercase;
}

/* LAYER LEGEND */

#layer-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
}

.layer-row {
    display: flex;
    align-items: center;
    gap: 11px;
    font-size: 13px;
    color: #E8F0F5;
    cursor: pointer;
}

.layer-row input {
    width: 17px;
    height: 17px;
    accent-color: #28B5E5;
    cursor: pointer;
}

.legend-symbol {
    width: 13px;
    height: 13px;
    display: inline-block;
    border-radius: 2px;
    flex-shrink: 0;
}

.legend-boundary {
    background: transparent;
    border: 2px solid #202020;
}

.legend-water {
    background: #2589D1;
}

.legend-stream {
    background: #63B8E8;
    height: 3px;
}

.legend-roads {
    background: #F0789D;
    height: 3px;
}

.legend-railway {
    background: #A78BFA;
    height: 3px;
}

.legend-landuse {
    background: #E6C74B;
}

.legend-buildings {
    background: #9C8A79;
}

/* LAYER BUTTONS */

.layer-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
}

.layer-actions button {
    flex: 1;
    padding: 8px;
    font-size: 11px;
    border: 1px solid #57738B;
    background: #203F5B;
    color: white;
    border-radius: 4px;
    cursor: pointer;
}

.layer-actions button:hover {
    background: #087EAF;
}

/* BASEMAP BUTTONS */

.basemap-buttons {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.basemap-btn {
    width: 100%;
    padding: 11px 13px;
    background: #203F5B;
    border: 1px solid #47647C;
    border-radius: 5px;
    color: #E7F0F6;
    text-align: left;
    cursor: pointer;
    font-size: 13px;
}

.basemap-btn:hover {
    background: #285A7C;
}

.basemap-btn.active {
    background: #087EAF;
    border-color: #55C8F0;
    color: white;
}

.basemap-btn span {
    margin-right: 9px;
}

/* FOOTER */

.sidebar-footer {
    padding: 18px 20px;
    color: #9CB7CA;
    font-size: 11px;
    line-height: 1.8;
}

/* MAP */

#map-container {
    flex: 1;
    min-width: 0;
    height: 100%;
    position: relative;
}

#map {
    width: 100%;
    height: 100%;
    position: relative;
    background: #E7E9E6;
}

/* OVERLAY BACKDROP FOR MOBILE */

#sidebar-backdrop {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.45);
    z-index: 1150;
}

/* NORTH ARROW */

#north-arrow {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 500;
    background: rgba(255,255,255,0.96);
    width: 48px;
    height: 64px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border-radius: 7px;
    box-shadow: 0 2px 9px rgba(0,0,0,0.25);
}

.north-label {
    font-size: 13px;
    font-weight: bold;
    color: #142D46;
}

.north-symbol {
    font-size: 30px;
    line-height: 32px;
    color: #142D46;
}

/* ==========================================================================
   SCALE BAR POSITION FIX - BOTTOM-LEFT (OPPOSITE OF ATTRIBUTION TEXT)
   ========================================================================== */

#custom-scale-target {
    position: absolute !important;
    bottom: 12px !important;
    left: 15px !important;
    top: auto !important;
    right: auto !important;
    z-index: 9999 !important;
    pointer-events: auto;
}

.ol-scale-line,
.ol-scale-bar,
#map .ol-scale-line,
#map .ol-scale-bar,
.ol-scale-line-inner,
div[class*="scale"] {
    bottom: 12px !important;
    left: 15px !important;
    top: auto !important;
    right: auto !important;
}

.ol-scale-line,
#custom-scale-target .ol-scale-line {
    position: absolute !important;
    background: rgba(255, 255, 255, 0.92) !important;
    padding: 3px 6px !important;
    border-radius: 4px !important;
    box-shadow: 0 1px 5px rgba(0,0,0,0.3) !important;
    border: 1px solid rgba(0,0,0,0.2) !important;
}

.ol-scale-line-inner {
    border: 2px solid #142D46 !important;
    border-top: none !important;
    color: #142D46 !important;
    font-size: 10px !important;
    font-weight: bold !important;
    text-align: center !important;
}

/* Hide extra overlapping scale text on top-left */
#map > div:not(#north-arrow):not(.ol-viewport):not(#popup):not(#custom-scale-target) {
    display: none !important;
}

/* QGIS ATTRIBUTION (BOTTOM-RIGHT) */
#map .ol-attribution {
    position: absolute !important;
    right: 5px !important;
    bottom: 5px !important;
    left: auto !important;
    top: auto !important;
    z-index: 1000 !important;
    font-size: 9px !important;
}

/* ZOOM BUTTONS */
#map .ol-zoom {
    top: 65px !important;
    left: 15px !important;
    bottom: auto !important;
    right: auto !important;
    z-index: 400 !important;
}

.ol-control {
    background: rgba(255,255,255,0.4) !important;
    padding: 3px !important;
}

.ol-control > button {
    background: #FFFFFF !important;
    color: #243B50 !important;
    border-radius: 4px !important;
}

/* POPUP */

.ol-popup {
    background: white;
    border-radius: 7px;
}

/* ==========================================================================
   MOBILE RESPONSIVE RULES (PHONES)
   ========================================================================== */

@media (max-width: 768px) {
    #mobile-menu-btn {
        display: block;
    }

    #sidebar-close-btn {
        display: block;
    }

    #sidebar {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 82%;
        max-width: 320px;
        min-width: 260px;
        transform: translateX(-100%);
    }

    #sidebar.open {
        transform: translateX(0);
    }

    #sidebar-backdrop.active {
        display: block;
    }

    #map .ol-zoom {
        top: 60px !important;
        left: 12px !important;
    }

    #custom-scale-target {
        left: 10px !important;
        bottom: 8px !important;
    }

    #map .ol-attribution {
        max-width: 55%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }
}

</style>
</head>

<body>

<div id="dashboard">

    <!-- FLOATING MOBILE MENU BUTTON -->
    <button id="mobile-menu-btn">
        <i class="fas fa-bars"></i> &nbsp;Layers / Menu
    </button>

    <!-- BACKDROP FOR MOBILE CLICK-OUTSIDE -->
    <div id="sidebar-backdrop"></div>

    <!-- LEFT SIDEBAR -->
    <aside id="sidebar">

        <div class="dashboard-header">
            <button id="sidebar-close-btn" aria-label="Close Sidebar">&times;</button>
            <div class="subtitle">
                GIS & REMOTE SENSING
            </div>

            <h1>Yadgir District</h1>

            <h2>Karnataka, India</h2>

            <div class="description">
                Geographic Information System<br>
                Spatial Data Visualization Dashboard
            </div>

        </div>

        <!-- MAP LEGEND -->
        <div class="panel-section">

            <div class="section-heading">
                <i class="fas fa-layer-group"></i>
                &nbsp; Map Legend
            </div>

            <div id="layer-list"></div>

            <div class="layer-actions">
                <button id="show-all">Select All</button>
                <button id="hide-all">Clear All</button>
            </div>

        </div>

        <!-- BASEMAPS -->
        <div class="panel-section">

            <div class="section-heading">
                <i class="fas fa-map"></i>
                &nbsp; Base Maps
            </div>

            <div class="basemap-buttons">

                <button class="basemap-btn active" id="satellite-btn">
                    <span>🌍</span> Satellite Imagery
                </button>

                <button class="basemap-btn" id="osm-btn">
                    <span>🗺️</span> OpenStreetMap
                </button>

                <button class="basemap-btn" id="light-btn">
                    <span>⬜</span> Light Map
                </button>

            </div>

        </div>

        <!-- FOOTER -->
        <div class="sidebar-footer">
            <hr style="border-color:#47647C;">
            <b>YADGIR DISTRICT</b><br>
            Karnataka, India<br>
            GIS-Based Spatial Information
        </div>

    </aside>

    <!-- MAP AREA -->
    <main id="map-container">

        <div id="map">

            <!-- DEDICATED SCALE BAR CONTAINER (BOTTOM LEFT) -->
            <div id="custom-scale-target"></div>

            <div id="popup" class="ol-popup">
                <a href="#" id="popup-closer" class="ol-popup-closer"></a>
                <div id="popup-content"></div>
            </div>

        </div>

        <!-- NORTH ARROW -->
        <div id="north-arrow">
            <div class="north-label">N</div>
            <div class="north-symbol">↑</div>
        </div>

    </main>

</div>


<!-- QGIS2WEB SCRIPTS -->
<script src="resources/qgis2web_expressions.js"></script>
<script src="./resources/functions.js"></script>
<script src="./resources/ol.js"></script>
<script src="./resources/ol-layerswitcher.js"></script>
<script src="resources/photon-geocoder-autocomplete.min.js"></script>
<script src="resources/olms.js"></script>

<!-- ORIGINAL MAP LAYERS -->
<script src="layers/buildings_2.js"></script>
<script src="layers/Landuse_3.js"></script>
<script src="layers/Railway_4.js"></script>
<script src="layers/Roads_5.js"></script>
<script src="layers/Stream_ydg_6.js"></script>
<script src="layers/Waterbodies_1_7.js"></script>
<script src="layers/Yadgir_Boundary_8.js"></script>

<!-- ORIGINAL STYLES -->
<script src="styles/buildings_2_style.js"></script>
<script src="styles/Landuse_3_style.js"></script>
<script src="styles/Railway_4_style.js"></script>
<script src="styles/Roads_5_style.js"></script>
<script src="styles/Stream_ydg_6_style.js"></script>
<script src="styles/Waterbodies_1_7_style.js"></script>
<script src="styles/Yadgir_Boundary_8_style.js"></script>

<script src="./layers/layers.js"></script>
<script src="./resources/Autolinker.min.js"></script>
<script src="./resources/qgis2web.js"></script>

<!-- DASHBOARD JAVASCRIPT -->
<script>
(function () {

    function initializeDashboard() {

        if (
            typeof map === "undefined" ||
            typeof ol === "undefined"
        ) {
            setTimeout(initializeDashboard, 300);
            return;
        }

        if (map.get("dashboardInitialized")) return;
        map.set("dashboardInitialized", true);

        /* 1. ORIGINAL LAYERS */
        var originalLayers = (typeof layersList !== "undefined") ? layersList : [];
        var allLayers = originalLayers.filter(function(layer) {
            return layer instanceof ol.layer.Base;
        });

        /* 2. LAYER DEFINITIONS */
        var definitions = [
            { label: "District Boundary", pattern: /yadgir.*boundary|boundary/, symbol: "legend-boundary", index: 6 },
            { label: "Waterbodies", pattern: /waterbod/, symbol: "legend-water", index: 5 },
            { label: "Streams", pattern: /stream/, symbol: "legend-stream", index: 4 },
            { label: "Roads", pattern: /roads?/, symbol: "legend-roads", index: 3 },
            { label: "Railway", pattern: /railway/, symbol: "legend-railway", index: 2 },
            { label: "Land Use", pattern: /landuse|land.use/, symbol: "legend-landuse", index: 1 },
            { label: "Buildings", pattern: /buildings?/, symbol: "legend-buildings", index: 0 }
        ];

        function getLayerName(layer) {
            return [
                layer.get("title"),
                layer.get("name"),
                layer.get("popuplayertitle"),
                layer.get("displayName")
            ].filter(Boolean).join(" ").toLowerCase();
        }

        var matchedLayers = [];
        var usedLayers = [];

        definitions.forEach(function(definition) {
            var layer = allLayers.find(function(item) {
                return !usedLayers.includes(item) && definition.pattern.test(getLayerName(item));
            });

            if (!layer) {
                var candidate = allLayers[definition.index];
                if (candidate && !usedLayers.includes(candidate)) {
                    layer = candidate;
                }
            }

            if (layer) {
                usedLayers.push(layer);
                matchedLayers.push({
                    label: definition.label,
                    symbol: definition.symbol,
                    layer: layer
                });
            }
        });

        /* 3. CREATE LEGEND */
        var layerList = document.getElementById("layer-list");

        matchedLayers.forEach(function(item) {
            var label = document.createElement("label");
            label.className = "layer-row";

            var checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = item.layer.getVisible();

            checkbox.addEventListener("change", function() {
                item.layer.setVisible(this.checked);
            });

            var symbol = document.createElement("span");
            symbol.className = "legend-symbol " + item.symbol;

            var name = document.createElement("span");
            name.textContent = item.label;

            label.appendChild(checkbox);
            label.appendChild(symbol);
            label.appendChild(name);
            layerList.appendChild(label);
        });

        /* 4. SELECT ALL */
        document.getElementById("show-all").addEventListener("click", function() {
            matchedLayers.forEach(function(item) {
                item.layer.setVisible(true);
            });
            layerList.querySelectorAll("input").forEach(function(input) {
                input.checked = true;
            });
        });

        /* 5. CLEAR ALL */
        document.getElementById("hide-all").addEventListener("click", function() {
            matchedLayers.forEach(function(item) {
                item.layer.setVisible(false);
            });
            layerList.querySelectorAll("input").forEach(function(input) {
                input.checked = false;
            });
        });

        /* 6. BASEMAPS */
        allLayers.forEach(function(layer) {
            if (layer instanceof ol.layer.Tile) {
                layer.setVisible(false);
            }
        });

        var satellite = new ol.layer.Tile({
            source: new ol.source.XYZ({
                url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
                attributions: "Tiles © Esri"
            }),
            visible: true
        });

        var osm = new ol.layer.Tile({
            source: new ol.source.OSM(),
            visible: false
        });

        var light = new ol.layer.Tile({
            source: new ol.source.XYZ({
                url: "https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png",
                attributions: "© OpenStreetMap contributors © CARTO"
            }),
            visible: false
        });

        map.getLayers().insertAt(0, satellite);
        map.getLayers().insertAt(0, osm);
        map.getLayers().insertAt(0, light);

        /* 7. BASEMAP SWITCHING */
        var basemapOptions = [
            { id: "satellite-btn", layer: satellite },
            { id: "osm-btn", layer: osm },
            { id: "light-btn", layer: light }
        ];

        basemapOptions.forEach(function(option) {
            document.getElementById(option.id).addEventListener("click", function() {
                basemapOptions.forEach(function(base) {
                    base.layer.setVisible(false);
                    document.getElementById(base.id).classList.remove("active");
                });
                option.layer.setVisible(true);
                document.getElementById(option.id).classList.add("active");
            });
        });

        /* 8. SCALE BAR SETUP */
        var controlsToRemove = [];
        map.getControls().forEach(function(c) {
            if (c instanceof ol.control.ScaleLine) {
                controlsToRemove.push(c);
            }
        });
        controlsToRemove.forEach(function(c) {
            map.removeControl(c);
        });

        var scaleTarget = document.getElementById("custom-scale-target");
        var cleanScaleBar = new ol.control.ScaleLine({
            units: "metric",
            bar: false,
            text: false,
            minWidth: 90,
            target: scaleTarget
        });
        map.addControl(cleanScaleBar);

        /* 9. MOBILE DRAWER INTERACTION */
        var sidebar = document.getElementById("sidebar");
        var menuBtn = document.getElementById("mobile-menu-btn");
        var closeBtn = document.getElementById("sidebar-close-btn");
        var backdrop = document.getElementById("sidebar-backdrop");

        function openSidebar() {
            sidebar.classList.add("open");
            backdrop.classList.add("active");
        }

        function closeSidebar() {
            sidebar.classList.remove("open");
            backdrop.classList.remove("active");
        }

        menuBtn.addEventListener("click", openSidebar);
        closeBtn.addEventListener("click", closeSidebar);
        backdrop.addEventListener("click", closeSidebar);

        window.addEventListener("resize", function() {
            map.updateSize();
            if (window.innerWidth > 768) {
                closeSidebar();
            }
        });

        map.updateSize();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initializeDashboard);
    } else {
        initializeDashboard();
    }
})();
</script>

</body>
</html>
